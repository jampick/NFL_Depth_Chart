name: Refresh draft data

# Re-pulls every source and rebuilds site/data.js each morning. Depth charts and
# injuries move all season. ADP stops moving at kickoff, and build_data.py keeps
# the last preseason ADP once FFC's pool goes in-season.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC daily

permissions:
  contents: write
  actions: write   # to dispatch deploy.yml, see the last step

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sources
        run: python tools/fetch_sources.py

      - name: Rebuild site/data.js
        run: python tools/build_data.py

      - name: Commit if the data actually moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- site/data.js; then
            echo "no change in site/data.js"
            exit 0
          fi
          git add site/data.js
          git commit -m "Refresh ADP, depth charts and schedule data"
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"
        id: commit

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
      # deploy's push trigger never fires for this commit. Dispatch it instead.
      - name: Deploy the new data
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
